# What differs between machines, read by templates as
# {{- $m := index .machines .chezmoi.hostname }}. Every machine must be listed:
# there is no default. Laptop or desktop is left out: infra/deploy.py asks
# hostnamectl.
#
#   wm          hyprland or sway: picks the compositor config and its packages.
#   lock_output the output hyprlock puts its input field, player and system info on.
#   text_scale  multiplies GTK and quickshell text; terminals stay at 10pt.
#   monitors    each output, and the workspaces it holds.

[machines.xeome-desktop]
wm          = "hyprland"
lock_output = "DP-3"
# 1.1 is a compromise for the 27" 1440p at 65 cm: 1.35 reached the 12'
# x-height reading floor but looked too big. The ultrabook gets there through
# monitor scale 2, so its text stays at 1.
text_scale  = 1.1
monitors = [
  { output = "HDMI-A-1", mode = "2560x1440@75",  position = "0x0",      scale = 1, workspaces = [1, 4] },
  { output = "DP-3",     mode = "1920x1080@144", position = "2560x360", scale = 1, workspaces = [2, 3, 5, 6, 7, 8, 9] },
]

[machines.emin-ultrabook]
wm          = "hyprland"
lock_output = "eDP-1"
text_scale  = 1
monitors = [
  { output = "DP-3",  mode = "3840x2160@60", position = "0x0",    scale = 2, workspaces = [2, 4, 5, 6] },
  { output = "eDP-1", mode = "1920x1200@60", position = "0x1080", scale = 1, workspaces = [1, 3, 7, 8, 9] },
]

# HP ProBook running swayfx, docked to an HP E24 G4. eDP-1 sits left of the
# external. Undocking is safe: sway ignores output directives for outputs that
# aren't connected, and HDMI-A-1's workspaces fall back to the only screen left.
[machines.emin-probook]
wm          = "sway"
lock_output = "eDP-1"
text_scale  = 1
monitors = [
  { output = "eDP-1",    mode = "1920x1080@60", position = "0x0",    scale = 1, workspaces = [1, 3] },
  { output = "HDMI-A-1", mode = "1920x1080@60", position = "1920x0", scale = 1, workspaces = [2, 4, 5, 6, 7, 8, 9] },
]
