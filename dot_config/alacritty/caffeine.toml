# Caffeine — https://github.com/crynta/terax-ai src/modules/theme/themes/caffeine.ts
#
# Mirrors ~/.config/ghostty/themes/caffeine and ~/.config/foot/foot.ini, so a
# change here wants the same change there. The background is graphite's panel
# from quickshell's Theme.qml, and so are the other neutrals; the hues are
# Caffeine's.

[colors.primary]
foreground = "#e6e7ea"
background = "#0e0e10"

# A bright block with the panel showing through the glyph.
[colors.cursor]
text = "#0e0e10"
cursor = "#f7f8f8"

# Theme.qml's `sel` flattened over the panel, since alacritty has no alpha
# here, with bright text.
[colors.selection]
text = "#f7f8f8"
background = "#1f1f21"

# Caffeine's `terminal.ansi` hues on graphite's neutrals: black and white are
# Theme.qml's rule/dim and text/bright. Black is `rule`, not a true black,
# because the background is already near-black.
[colors.normal]
black = "#232427"
white = "#e6e7ea"
red = "#e06c75"
green = "#b5c98f"
yellow = "#ffd9a0"
blue = "#8fb0d9"
magenta = "#cba6c9"
cyan = "#88c0c8"

[colors.bright]
black = "#8a8f98"
white = "#f7f8f8"
red = "#ff8a93"
green = "#c9dba8"
yellow = "#ffe6c4"
blue = "#a9c3e0"
magenta = "#ddc0db"
cyan = "#a4d4da"
