[env]
TERM = "xterm-256color"

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Medium Italic"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control|Shift"

[window]
# Opaque. The whole point of pinning a scheme is that #111111 is #111111
# everywhere; at 0.85 every contrast ratio was a function of the wallpaper.
opacity = 1.0

[window.padding]
x = 15
y = 15

[general]
ipc_socket = true

import = [
   # Caffeine, the same scheme as ~/.config/ghostty/config
   "~/.config/alacritty/caffeine.toml"
   #"~/.config/alacritty/catppuccin-mocha.toml"
   #"~/.config/alacritty/gruvbox_material_hard_dark.toml"
   #"~/.config/alacritty/monokai.toml"
   #"~/.config/alacritty/rose-pine.toml"
   # "~/.config/alacritty/cosmicmidnight.toml"
]
