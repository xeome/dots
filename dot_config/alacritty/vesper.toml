# Vesper, warmed to match quickshell's Theme.qml — mirrors ~/.config/ghostty/config.
#
# The normal/bright blocks below are still verbatim /usr/share/ghostty/themes/Vesper:
# it is where the shell's accent (#ffc799) and warn (#ff8080) came from, so the
# ANSI 16 already matched and only the surfaces and the selection moved.

[colors.primary]
foreground = "#eeeeee"
# Was #000000, darker than even stock Vesper's #101010. This is the shell's bar
# colour, so a terminal and the bar above it are now the same black.
background = "#111111"

[colors.cursor]
text = "#111111"
cursor = "#ffc799"

# The shell fills selections with the accent and sets dark text on top
# (Theme.accent / Theme.fgOnAccent); stock Vesper's muddy olive was the one
# colour here that belonged to no other surface on the desktop.
[colors.selection]
text = "#111111"
background = "#ffc799"

[colors.normal]
black = "#101010"
red = "#f5a191"
green = "#90b99f"
yellow = "#e6b99d"
blue = "#aca1cf"
magenta = "#e29eca"
cyan = "#ea83a5"
white = "#a0a0a0"

[colors.bright]
black = "#7e7e7e"
red = "#ff8080"
green = "#99ffe4"
yellow = "#ffc799"
blue = "#b9aeda"
magenta = "#ecaad6"
cyan = "#f591b2"
white = "#ffffff"
