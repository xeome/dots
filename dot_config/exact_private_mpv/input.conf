LEFT seek -5
RIGHT seek +5
Shift+LEFT seek -1
Shift+RIGHT seek +1
Shift+UP seek +1 exact
Shift+DOWN seek -1 exact

Space cycle pause
q quit
Enter cycle pause

UP add volume 5
DOWN add volume -5
m cycle mute

MBTN_LEFT_DBL cycle fullscreen
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5
WHEEL_LEFT seek -5
WHEEL_RIGHT seek +5

j cycle sub
J cycle sub down
k cycle audio
K cycle audio down
z add sub-delay -0.1
Z add sub-delay +0.1
Ctrl+z add audio-delay -0.1
Ctrl+Z add audio-delay +0.1
r add sub-pos -1
t add sub-pos +1

f cycle fullscreen
T cycle ontop
a cycle aspect

. seek +1
, seek -1

[ seek -10
] seek +10

< add speed -0.25
> add speed +0.25
BS set speed 1.0

s screenshot
S screenshot video

p script-binding modernf/visibility
o show-progress

