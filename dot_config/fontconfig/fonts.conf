<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Grayscale, not subpixel: ClearType-style AA measured no gain in
         legibility, speed or comfort over tuned grayscale (Sheedy 2008), and
         it is wrong anyway under fractional scaling. GTK4 already renders
         grayscale (gsettings font-antialiasing), so this makes everyone agree.
         No dpi here: the compositor scale owns size, and a hardcoded dpi only
         reached the apps that still read it. -->
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>none</const>
        </edit>
        <edit name="autohint" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <!-- Every generic fallback lands on the two faces the desktop is built on,
         instead of whichever Noto sorts first. -->
    <alias>
        <family>sans-serif</family>
        <prefer><family>Inter</family></prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer><family>JetBrainsMono Nerd Font</family></prefer>
    </alias>
</fontconfig>
