# Caffeine — https://github.com/crynta/terax-ai src/modules/theme/themes/caffeine.ts
#
# Mirrors ~/.config/ghostty/themes/caffeine{,-light} and alacritty's
# caffeine.toml, so a change here wants the same change there. The dark
# background is graphite's panel from quickshell's Theme.qml.

[main]
font=JetBrainsMono Nerd Font:style=Medium:size=10
font-bold=JetBrainsMono Nerd Font:style=Bold:size=10
font-italic=JetBrainsMono Nerd Font:style=Medium Italic:size=10
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=10
pad=15x15
term=xterm-256color

# foot cannot follow the desktop colour scheme, so theme-toggle sends it
# SIGUSR1 for [colors-dark] and SIGUSR2 for [colors-light]. foot rejects stale
# keys and sections, so run `foot --check-config` after editing.
initial-color-theme=dark

[colors-dark]
# Opaque, so contrast does not depend on what is behind the window.
alpha=1.0

background=0e0e10
foreground=e6e7ea

# A bright block with the panel showing through the glyph. foot takes `text bg`.
cursor=0e0e10 f7f8f8

# Theme.qml's `sel` flattened over the panel, with bright text.
selection-foreground=f7f8f8
selection-background=1f1f21

# Caffeine's `terminal.ansi` hues on graphite's neutrals: regular0/bright0 and
# regular7/bright7 are Theme.qml's rule/dim and text/bright. regular0 is
# `rule`, not a true black, because the background is already near-black.
regular0=232427
regular1=e06c75
regular2=b5c98f
regular3=ffd9a0
regular4=8fb0d9
regular5=cba6c9
regular6=88c0c8
regular7=e6e7ea
bright0=8a8f98
bright1=ff8a93
bright2=c9dba8
bright3=ffe6c4
bright4=a9c3e0
bright5=ddc0db
bright6=a4d4da
bright7=f7f8f8

[colors-light]
alpha=1.0

background=f9f9f9
foreground=202020

cursor=ffffff 644a40

selection-foreground=202020
selection-background=e1dddb

regular0=3a322a
regular1=c0392b
regular2=5a7d3c
regular3=a9762a
regular4=3a6ea5
regular5=9a4f8a
regular6=2a8589
regular7=c8c0b4
bright0=6b6258
bright1=d04a3a
bright2=6a9048
bright3=c08a3a
bright4=4a7eb5
bright5=aa5f9a
bright6=3a989c
bright7=202020

[cursor]
style=block

[mouse]
hide-when-typing=yes

[key-bindings]
font-increase=Control+Shift+plus
font-decrease=Control+Shift+underscore
font-reset=Control+0
