#
# Color definition
#
# Managed by chezmoi — edit dot_config/sway/conf.d/colors.conf
#
# The zinc + amber palette from hyprland lua_modules/colors.lua, which is also
# what quickshell's Theme.qml draws. Replaces a red/grey set that matched
# nothing else in the repo.

set $background #101010
set $foreground #ffffff
set $primary    #ffc799
set $surface    #161616
set $muted      #505050
set $error      #ff8080

# Window colors: border, background, text, indicator, child_border
client.focused          $primary    $primary    $background  $primary    $primary
client.focused_inactive $surface    $surface    $foreground  $surface    $surface
client.unfocused        $surface    $surface    $muted       $surface    $surface
client.urgent           $error      $error      $background  $error      $error
