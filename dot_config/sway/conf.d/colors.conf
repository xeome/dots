#
# Color definition
#
# Managed by chezmoi — edit dot_config/sway/conf.d/colors.conf
#
# The Caffeine colour scheme, same values as hyprland's lua_modules/colors.lua
# and quickshell's Theme.qml.

set $background #111111
set $foreground #eeeeee
set $primary    #ffe0c2
set $secondary  #393028
set $surface    #191919
set $muted      #484848
set $error      #e54d2e

# Window colors: border, background, text, indicator, child_border
# Focused wears `primary` with dark text on it — Caffeine's primaryForeground,
# the same pair Theme.qml calls accent / fgOnAccent.
client.focused          $primary    $primary    #081a1b      $primary    $primary
client.focused_inactive $surface    $surface    $foreground  $surface    $surface
client.unfocused        $surface    $surface    $muted       $surface    $surface
client.urgent           $error      $error      #081a1b      $error      $error
