# The float rules from hyprland's lua_modules/rules.lua. Its no_screen_share
# rules have no sway equivalent. Managed by chezmoi.

for_window [app_id="^(gradia|pavucontrol|easyeffects|org\\.kde\\.ark|file-roller|nwg-look|wdisplays|qt5ct|qt6ct|kvantummanager)$"] floating enable
for_window [app_id="^xdg-desktop-portal-gtk$"] floating enable, move position center
for_window [app_id="^com\\.sessionizer\\.fzf$"] floating enable, resize set 800 500, move position center

# Borderless overlay pinned to the origin so the region selector lines up with
# the screen.
for_window [app_id="^flameshot$"] border pixel 0, floating enable, fullscreen disable, move absolute position 0 0
