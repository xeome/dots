#################################
#            Startup            #
#################################
# Managed by chezmoi — edit dot_config/sway/conf.d/startup.conf
#
# Mirrors hyprland lua_modules/startup.lua. `exec` rather than `exec_always`
# throughout: a config reload must not spawn a second copy of anything.

# Hand the session env to user services and portals.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE SDL_VIDEODRIVER QT_QPA_PLATFORM SSH_AUTH_SOCK

# ~~~ power management
# hyprlock rather than gtklock, so all three machines share one lock config.
exec /usr/bin/swayidle -w timeout 840 hyprlock timeout 900 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"'

# ~~~ system services
exec /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec autotiling-rs
exec systemctl --user start vicinae.service
# Dropped: kdeconnectd, which isn't installed on this machine.

# ~~~ desktop environment
# Bar, notifications and OSD, all one process. Replaced waybar + swaync, which
# also frees the org.freedesktop.Notifications name swaync.service kept
# crash-looping over.
exec qs -c xeome
exec waypaper --restore

# ~~~ applications
exec systemctl start --user app-com.mitchellh.ghostty.service
exec thunar --daemon
# Redundant with quickshell's network module for picking an AP, but it still
# carries the VPN and captive-portal bits that module deliberately doesn't.
exec nm-applet
exec bitwarden-desktop

# Launch zen-browser on workspace 2. sway has no [workspace N silent] rule, so
# this is the switch-launch-switch idiom the config has always used.
workspace 2
exec zen-browser
workspace 1
# Dropped: an `exec vesktop` that autostarted a package which isn't installed
# ($mod+d launches equibop on demand instead).
