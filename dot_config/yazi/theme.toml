#:schema https://yazi-rs.github.io/schemas/theme.json
# vim:fileencoding=utf-8:foldmethod=marker
#
# Graphite, same values as quickshell's Theme.qml. File types, permissions and
# markers keep the terminal ANSI hues; chrome is neutral, focus is warm.
#
# Was generated by matugen from the wallpaper; the [templates.yazi] entry is
# gone from matugen's config now that the palette is pinned rather than derived.
#
# Schema is yazi >= 25.5 ([mgr], not [manager]; perm_*, not permissions_*). The
# old matugen template was still on the v24 schema, which this version rejects
# wholesale — so yazi was falling back to its stock blue-on-gray theme, wearing
# neither the wallpaper's colours nor these.

# : Manager {{{

[mgr]
cwd = { fg = "#f7f8f8", bold = true }

find_keyword  = { fg = "#e5ae52", bold = true, italic = true, underline = true }
find_position = { fg = "#cba6c9", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied   = { fg = "#b5c98f", bg = "#b5c98f" }
marker_cut      = { fg = "#e2715a", bg = "#e2715a" }
marker_marked   = { fg = "#88c0c8", bg = "#88c0c8" }
marker_selected = { fg = "#ffd9a0", bg = "#ffd9a0" }
marker_symbol   = "│"

# Counts are chips: an ANSI fill carrying ground-coloured text.
count_copied   = { fg = "#0a0a0c", bg = "#b5c98f" }
count_cut      = { fg = "#0a0a0c", bg = "#e2715a" }
count_selected = { fg = "#0a0a0c", bg = "#ffd9a0" }

border_symbol = "│"
border_style  = { fg = "#232427" }

syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#f7f8f8", bg = "#232427", bold = true }
inactive = { fg = "#8a8f98", bg = "#151618" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

# Three modes, three meanings: neutral for normal, warm (graphite's focus
# colour) for select, hot for unset.
[mode]
normal_main = { fg = "#0a0a0c", bg = "#e6e7ea", bold = true }
normal_alt  = { fg = "#e6e7ea", bg = "#232427" }

select_main = { fg = "#0a0a0c", bg = "#e5ae52", bold = true }
select_alt  = { fg = "#e5ae52", bg = "#232427" }

unset_main = { fg = "#0a0a0c", bg = "#e2715a", bold = true }
unset_alt  = { fg = "#e2715a", bg = "#232427" }

# : }}}


# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}


# : Status bar {{{

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permission bits, from the terminal ANSI ramp.
perm_sep   = { fg = "#5c5046" }
perm_type  = { fg = "#b5c98f" }
perm_read  = { fg = "#ffd9a0" }
perm_write = { fg = "#e2715a" }
perm_exec  = { fg = "#88c0c8" }

progress_label  = { fg = "#e6e7ea", bold = true }
progress_normal = { fg = "#e6e7ea", bg = "#232427" }
progress_error  = { fg = "#e2715a", bg = "#232427" }

# : }}}


# : Which {{{

[which]
border          = { fg = "#8a8f98" }
cols            = 3
mask            = { bg = "#151618" }
cand            = { fg = "#f7f8f8" }
rest            = { fg = "#8a8f98" }
desc            = { fg = "#cba6c9" }
separator       = "  "
separator_style = { fg = "#232427" }

# : }}}


# : Confirmation {{{

[confirm]
border     = { fg = "#8a8f98" }
title      = { fg = "#f7f8f8" }
body       = {}
list       = {}
btn_yes    = { fg = "#0a0a0c", bg = "#e6e7ea" }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#8a8f98" }
title  = { fg = "#f7f8f8" }

tbl_col  = { fg = "#f7f8f8" }
tbl_cell = { fg = "#f7f8f8", bg = "#232427" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#b5c98f" }
title_warn  = { fg = "#ffd9a0" }
title_error = { fg = "#e2715a" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

# : }}}


# : Picker {{{

[pick]
border   = { fg = "#8a8f98" }
active   = { fg = "#cba6c9", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#8a8f98" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border   = { fg = "#8a8f98" }
active   = { fg = "#f7f8f8", bg = "#232427" }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

# : }}}


# : Task manager {{{

[tasks]
border  = { fg = "#8a8f98" }
title   = {}
hovered = { fg = "#cba6c9", bold = true }

# : }}}


# : Help menu {{{

[help]
border  = { fg = "#8a8f98" }
chord   = { fg = "#ffd9a0" }
action  = {}
hovered = { fg = "#f7f8f8", bg = "#232427", bold = true }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "#88c0c8" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#cba6c9" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffd9a0" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#e06c75" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#5c5046" },
	# Special file
	{ url = "*", is = "orphan", bg = "#e2715a" },
	{ url = "*", is = "exec"  , fg = "#b5c98f" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "#e2715a" },
	{ url = "*/", is = "dummy", bg = "#e2715a" },
	# Fallback
	{ url = "*/", fg = "#8fb0d9" },
]

# : }}}
