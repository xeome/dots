[meta]
version = 1
name = "Caffeine"
description = "The Caffeine colour scheme, same values as quickshell's Theme.qml"
variant = "dark"

[colors.core]
background = "#111111"
foreground = "#eeeeee"
secondary_background = "#191919"
# Lifted off Caffeine's own #201e18, which is invisible against #191919 —
# same reason Theme.qml lifts it.
border = "#2e2e2e"
accent = "#ffe0c2"

# Caffeine's terminal.ansi, which is where this scheme keeps its hues.
[colors.accents]
blue = "#8fb0d9"
green = "#b5c98f"
magenta = "#cba6c9"
orange = "#ffd9a0"
purple = "#ddc0db"
red = "#e54d2e"
yellow = "#ffe6c4"
cyan = "#88c0c8"

[colors.list.item.selection]
background = { name = "#222222", opacity = 1.0 }
secondary_background = "#2a2a2a"
