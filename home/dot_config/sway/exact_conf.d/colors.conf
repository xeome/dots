# Graphite colours, the same values as hyprland's lua_modules/settings.lua and
# quickshell's Theme.qml. Managed by chezmoi.

set $background #0a0a0c
set $text       #e6e7ea
set $dim        #8a8f98
set $focus      #ffffff80
set $hot        #e2715a
set $line       #ffffff14

# Columns: border, background, text, indicator, child_border.
client.focused          $focus      $background $text        $focus      $focus
client.focused_inactive $line       $background $dim         $line       $line
client.unfocused        $line       $background $dim         $line       $line
client.urgent           $hot        $hot        $background  $hot        $hot
