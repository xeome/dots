# Keybinds, kept 1:1 with hyprland's lua_modules/keybinds.lua wherever sway has
# an equivalent. Managed by chezmoi.

set $mod Mod4
floating_modifier $mod

bindsym $mod+Shift+r reload

bindsym $mod+Return exec ghostty
bindsym $mod+q exec zen-browser
bindsym $mod+e exec thunar
bindsym $mod+r exec vicinae toggle
bindsym $mod+v exec code --ozone-platform=wayland
# Flags come from ~/.config/equibop-flags.conf, which /usr/bin/equibop reads.
bindsym $mod+d exec equibop
# Hyprland's Print opens the quickshell overlay, which needs grim and libvips.
# Sway machines have flameshot instead.
bindsym Print exec flameshot gui -r | wl-copy

bindsym $mod+a exec bash ~/.local/bin/status
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# The quickshell OSD watches PipeWire and the backlight itself, so these only
# change the value. Caps Lock stays unbound: its OSD reads the keyboard LED,
# and a bind here would take over the toggle.
bindsym XF86AudioRaiseVolume exec pamixer -i 5
bindsym XF86AudioLowerVolume exec pamixer -d 5
bindsym XF86AudioMute exec pamixer -t
bindsym XF86AudioMicMute exec pamixer --default-source -t
bindsym XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

bindsym $mod+l exec hyprlock
# A machine without a lid never fires it.
bindswitch --locked lid:on exec hyprlock
bindsym $mod+b exec sh ~/.config/emoji/emoji.sh
bindsym $mod+Shift+v exec vicinae cmd launch clipboard:history
bindsym $mod+k exec qs -c xeome ipc call notifs toggle
bindsym $mod+t exec bash ~/.local/bin/theme-toggle
bindsym $mod+p exec ghostty --class=com.sessionizer.fzf -e ~/.local/bin/sessionizer

bindsym $mod+Escape workspace back_and_forth
bindsym $mod+Shift+c kill
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+f fullscreen toggle
bindsym $mod+Control+space floating toggle
# Sway only: its tiling needs explicit moves.
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
bindsym $mod+0 workspace 10

bindsym $mod+Shift+1 move container to workspace 1
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace 9
bindsym $mod+Shift+0 move container to workspace 10
