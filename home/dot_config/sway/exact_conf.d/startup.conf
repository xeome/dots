# Autostart, mirroring hyprland's lua_modules/startup.lua. Managed by chezmoi.
# `exec`, not `exec_always`: a config reload must not spawn a second copy.

# Hand the session env to user services and portals.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE SDL_VIDEODRIVER QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE SSH_AUTH_SOCK

# hyprlock, so every machine shares one lock config.
exec /usr/bin/swayidle timeout 840 'pidof hyprlock || hyprlock' timeout 900 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"'

exec /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec autotiling-rs
exec systemctl --user start vicinae.service

# Bar, notifications and OSD, all one process.
exec qs -c xeome
exec waypaper --restore

exec systemctl start --user app-com.mitchellh.ghostty.service
exec thunar --daemon
# Quickshell's network module picks APs; nm-applet still covers VPN and
# captive portals.
exec nm-applet
exec bitwarden-desktop

# Sway has no [workspace N silent] exec rule.
workspace 2
exec zen-browser
workspace 1
