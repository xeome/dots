# beesd sources this. infra/deploy.py adds the UUID= line above, the root
# filesystem's.
#
# -c 1: one worker thread.
# -g 2: workers pause while the load average is above 2. At 0.3 they sat at
#   zero through ordinary desktop use, and the small-extent passes fell up to
#   14h behind.
# -v 7: drops bees' DEBUG lines, millions a week, which pushed the rest of the
#   system journal out. Keeps the INFO dedup and PROGRESS lines bees-report reads.
OPTIONS="--throttle-factor 1.0 -c 1 -g 2 -v 7"

# Upstream sizes the hash table at 128 MiB per TB of unique data: ~0.5 TB here.
# beesd resizes the file, and bees forgets every block hashed so far.
DB_SIZE=$((128*1024*1024))
