# From infra/deploy.py — edit: ~/.local/share/chezmoi/infra/files/boot/
# plymouthd.conf's UseSimpledrm=1 makes dracut's plymouth module depend on
# simpledrm instead of drm, which drops the GPU's KMS driver from the
# initramfs. Keep it: udev loads it while the splash shows, and plymouth
# moves over to it.
add_dracutmodules+=" drm "
# The fallback initramfs is not hostonly, so drm brings every GPU driver. The
# NVIDIA ones carry ~100M of firmware, which overflows a 1G ESP.
omit_drivers+=" nouveau nova_core "
