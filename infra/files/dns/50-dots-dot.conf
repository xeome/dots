# From infra/deploy.py — edit: ~/.local/share/chezmoi/infra/files/dns/
#
# A drop-in, so the package's resolved.conf stays stock. Drop-ins outrank it for
# single-value keys, but DNS= and Domains= are lists that *append* — hence the
# empty assignment before each. Without it a hand-edited DNS= in the main file
# (this repo has met one) silently prepends the router to the system resolvers.
#
# FallbackDNS covers the window before the dispatcher has run (it is only used
# while no link has servers), so it names the same two.
[Resolve]
DNS=
FallbackDNS=1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
Domains=
DNSOverTLS=opportunistic
DNSSEC=no
MulticastDNS=no
