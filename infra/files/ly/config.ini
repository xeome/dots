# From infra/deploy.py — edit: ~/.local/share/chezmoi/infra/files/ly/
# Only what differs from Ly's defaults, which config.ini.example lists: Ly
# fills every missing key from them.

# Eight-colour mode, so Ly uses the console palette from boot/cmdline.
# 0xSSRRGGBB: SS styling, the low bits a TB_ colour. Bold picks the bright
# slot on the Linux console.
full_color = false
# TB_WHITE: slot 7, text
fg = 0x00000008
# TB_BLACK bold: slot 8, dim
border_fg = 0x01000001
# TB_RED bold: slot 9
error_fg = 0x01000002

bigclock = en
hide_version_string = true
