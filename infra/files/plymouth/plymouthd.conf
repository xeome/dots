# From infra/deploy.py — edit: ~/.local/share/chezmoi/infra/files/plymouth/
# ThemeDir keeps the theme in /etc: plymouthd and plymouth-populate-initrd
# both look for <ThemeDir>/<Theme>/<Theme>.plymouth.
[Daemon]
ThemeDir=/etc/plymouth/themes
Theme=dots
# Without it the splash waits for the GPU driver, ~5s for amdgpu here.
# dracut reads it too: see boot/dracut.conf.
UseSimpledrm=1
